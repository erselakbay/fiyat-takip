name: Fiyat takibi

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatları çek
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python takip.py
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-takip"
          git config user.email "fiyat-takip@users.noreply.github.com"
          git add veri
          git diff --cached --quiet || git commit -m "Fiyatlar $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
